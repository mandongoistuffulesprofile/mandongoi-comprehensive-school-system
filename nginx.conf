server {
    listen 80;
    server_name mandongoicomprehensive.sc.ke www.mandongoicomprehensive.sc.ke;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mandongoicomprehensive.sc.ke www.mandongoicomprehensive.sc.ke;

    ssl_certificate /etc/letsencrypt/live/mandongoicomprehensive.sc.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mandongoicomprehensive.sc.ke/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://api:4000;
    }

    location /health {
        proxy_pass http://api:4000;
    }
}
