services:
  - type: web
    name: cbc-school-system-api
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    postDeployCommand: npx tsx src/db/migrate.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cbc-school-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 7d
      - key: MPESA_ENVIRONMENT
        value: sandbox
      - key: MPESA_SHORTCODE
        value: 174379
      - key: CORS_ORIGIN
        value: https://mandongoicomprehesive.sc.ke
      - key: SENTRY_DSN
        value: https://796600ebb92fb6f3ff81bd68b6199307@o4511767494590464.ingest.us.sentry.io/4511767506518016

databases:
  - name: cbc-school-db
    plan: free
    databaseName: neondb
    user: neondb_owner
