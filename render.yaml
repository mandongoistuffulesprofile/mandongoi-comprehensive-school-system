services:
  - type: web
    name: mandongoi-school-api
    env: node
    plan: free
    rootDir: api
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    postDeployCommand: npx tsx src/db/migrate.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 7d
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_ENVIRONMENT
        value: sandbox
      - key: MPESA_SHORTCODE
        value: 174379
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: SMS_SENDER_ID
        sync: false
      - key: SMS_PARTNER_ID
        sync: false
      - key: CORS_ORIGIN
        value: https://mandongoicomprehensive.sc.ke
      - key: SENTRY_DSN
        value: https://796600ebb92fb6f3ff81bd68b6199307@o4511767494590464.ingest.us.sentry.io/4511767506518016
